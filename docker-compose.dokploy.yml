version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - dokploy-network

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1d
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - redis
    networks:
      - dokploy-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "8881:80"
    depends_on:
      - backend
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
