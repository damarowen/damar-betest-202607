version: '3.8'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - dokploy-network

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/db_damar_backend_betest
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1d
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - mongo
      - redis
    networks:
      - dokploy-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:8888:80"
    depends_on:
      - backend
    networks:
      - dokploy-network

volumes:
  mongo_data:

networks:
  dokploy-network:
    external: true
